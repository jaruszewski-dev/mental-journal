services:
          postgres:
                    image: postgres:16-alpine
                    container_name: mental-journal-postgres
                    restart: unless-stopped
                    ports:
                              - '${POSTGRES_PORT:-5432}:5432'
                    environment:
                              POSTGRES_USER: ${POSTGRES_USER:-mental_journal}
                              POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mental_journal}
                              POSTGRES_DB: ${POSTGRES_DB:-mental_journal}
                    volumes:
                              - postgres_data:/var/lib/postgresql/data
                    healthcheck:
                              test:
                                        [
                                                  'CMD-SHELL',
                                                  'pg_isready -U ${POSTGRES_USER:-mental_journal} -d ${POSTGRES_DB:-mental_journal}',
                                        ]
                              interval: 5s
                              timeout: 5s
                              retries: 5
                              start_period: 10s

          redis:
                    image: redis:7-alpine
                    container_name: mental-journal-redis
                    restart: unless-stopped
                    ports:
                              - '${REDIS_PORT:-6379}:6379'
                    volumes:
                              - redis_data:/data
                    command: ['redis-server', '--appendonly', 'yes']
                    healthcheck:
                              test: ['CMD', 'redis-cli', 'ping']
                              interval: 5s
                              timeout: 3s
                              retries: 10
                              start_period: 5s

volumes:
          postgres_data:
          redis_data:
