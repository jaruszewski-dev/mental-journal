services:
  postgres:
    image: postgres:16-alpine
    container_name: mental-journal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mental_journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-mental_journal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mental-journal-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: mental-journal-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mental_journal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mental_journal}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in docker/.env.prod}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in docker/.env.prod}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      SESSION_REFRESH_TTL: ${SESSION_REFRESH_TTL:-7d}
      EMAIL_TTL: ${EMAIL_TTL:-24h}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      FALLBACK_LANGUAGE: ${FALLBACK_LANGUAGE:-pl}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SHADOWBAN_EXPIRY_CRON: ${SHADOWBAN_EXPIRY_CRON:-0 0 * * *}
      SHADOWBAN_TIME_ZONE: ${SHADOWBAN_TIME_ZONE:-Europe/Warsaw}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_S3_API_ENDPOINT: ${CLOUDFLARE_S3_API_ENDPOINT:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL:-}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://api:3001
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL in docker/.env.prod}
    container_name: mental-journal-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_ORIGIN: http://api:3001
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
